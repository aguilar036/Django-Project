<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Preguntas</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            font-size: 18px;
            text-align: left;
        }
        thead {
            background-color: #333;
            color: #fff;
        }
        th, td {
            padding: 12px 15px;
            border: 1px solid #ddd;
        }
        tbody tr:nth-child(even) {
            background-color: #f3f3f3;
        }
        tbody tr:hover {
            background-color: #f1f1f1;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .no-questions {
            text-align: center;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Pregunta</th>
                <th>Fecha de Publicación</th>
            </tr>
        </thead>
        <tbody>
        {% if questions %}
            {% for question in questions %}
                <tr>
                    <td>
                        <a href="/polls/{{ question.id }}">{{ question }}</a>
                    </td>
                    <td>
                        {{ question.pub_date|date:"d M Y" }}
                    </td>
                </tr>
            {% endfor %}
        {% else %}
            <tr>
                <td colspan="2" class="no-questions">
                    No hay preguntas :(
                </td>
            </tr>
        {% endif %}
        </tbody>
    </table>
</body>
</html>
